
<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>My Calculator</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #e9ecef;
        }

        .calculator {
            max-width: 350px;
            margin: 70px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        #input {
            width: 100%;
            height: 70px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 15px;
            background-color: white;
        }

        .btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btns .btn {
            margin: 0;
            min-height: 55px;
            font-size: 18px;
        }

        .calculate {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2 class="mb-4 text-center">Calculator</h2>

        <!-- Calculator Display -->
        <input
            type="text"
            id="input"
            class="form-control"
            readonly
            placeholder="0"
            aria-label="Calculator display"
        >

        <!-- Calculator Buttons -->
        <div class="btns">

            <button class="btn btn-danger" onclick="allClear()">C</button>
            <button class="btn btn-warning" onclick="del()">D</button>
            <button class="btn btn-secondary" onclick="appendValue('%')">%</button>
            <button class="btn btn-secondary" onclick="appendValue('/')">/</button>

            <button class="btn btn-secondary" onclick="appendValue('1')">1</button>
            <button class="btn btn-secondary" onclick="appendValue('2')">2</button>
            <button class="btn btn-secondary" onclick="appendValue('3')">3</button>
            <button class="btn btn-secondary" onclick="appendValue('+')">+</button>

            <button class="btn btn-secondary" onclick="appendValue('4')">4</button>
            <button class="btn btn-secondary" onclick="appendValue('5')">5</button>
            <button class="btn btn-secondary" onclick="appendValue('6')">6</button>
            <button class="btn btn-secondary" onclick="appendValue('-')">-</button>

            <button class="btn btn-secondary" onclick="appendValue('7')">7</button>
            <button class="btn btn-secondary" onclick="appendValue('8')">8</button>
            <button class="btn btn-secondary" onclick="appendValue('9')">9</button>
            <button class="btn btn-secondary" onclick="appendValue('*')">*</button>

            <button class="btn btn-secondary" onclick="appendValue('0')">0</button>
            <button class="btn btn-secondary" onclick="appendValue('.')">.</button>
            <button class="btn btn-success calculate" onclick="calculate()">Calculate (=)</button>

        </div>
    </div>

    <!-- JavaScript -->
    
<script>
    const input = document.getElementById("input");

    // Add numbers and operators
    function appendValue(value) {
        if (input.value === "Error") {
            input.value = "";
        }

        input.value += value;
    }

    // Clear calculator
    function allClear() {
        input.value = "";
    }

    // Delete last character
    function del() {
        input.value = input.value.slice(0, -1);
    }

    // Calculate result
    function calculate() {
        const expression = input.value.trim();

        if (expression === "") {
            return;
        }

        // Allow only valid calculator characters
        if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
            input.value = "Error";
            return;
        }

        try {
            const result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!Number.isFinite(result)) {
                input.value = "Error";
                return;
            }

            input.value = String(Number(result.toPrecision(12)));
        } catch (error) {
            input.value = "Error";
        }
    }

    // Keyboard support
    document.addEventListener("keydown", function(event) {
        const key = event.key;

        // Numbers and mathematical operators
        if (/^[0-9+\-*/%.()]$/.test(key)) {
            event.preventDefault();
            appendValue(key);
        }

        // Calculate using Enter or =
        else if (key === "Enter" || key === "=") {
            event.preventDefault();
            calculate();
        }

        // Delete last character
        else if (key === "Backspace") {
            event.preventDefault();
            del();
        }

        // Clear calculator using Escape or Delete
        else if (key === "Escape" || key === "Delete") {
            event.preventDefault();
            allClear();
        }
    });
</script>


</body>
</html>
